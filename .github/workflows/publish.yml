name: publish

on:
  push:
    branches: [stable]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: blacklanternsecurity/release-workflows/.github/workflows/release-check.yml@4f32510b1cdfe7305aa27daa3f6fd72e4c03c21b # v1.5.0
    secrets:
      BLS_RELEASE_PRIVATE_KEY: ${{ secrets.BLS_RELEASE_PRIVATE_KEY }}

  tests:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml # zizmor: ignore[self-repository]
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  release:
    needs: [check, pypi]
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: blacklanternsecurity/release-workflows/.github/workflows/publish.yml@4f32510b1cdfe7305aa27daa3f6fd72e4c03c21b # v1.5.0
    secrets:
      BLS_RELEASE_PRIVATE_KEY: ${{ secrets.BLS_RELEASE_PRIVATE_KEY }}
    with:
      tag: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
